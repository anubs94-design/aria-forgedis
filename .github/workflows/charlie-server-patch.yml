name: Charlie server patch

on:
  push:
    branches:
      - forgedis-public-redesign
    paths:
      - tools/charlie_patch_server.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: forgedis-public-redesign
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Charlie patch
        run: python tools/charlie_patch_server.py

      - name: Verify patch syntax
        run: python -m py_compile server.py

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "Charlie CI"
          git config user.email "actions@users.noreply.github.com"
          git add server.py connexion-industrial.html tests/test_charlie20.py
          git commit -m "fix(P0): owner server session, canonical verifier_forfait and F821 cleanup"
          git push origin HEAD:forgedis-public-redesign
