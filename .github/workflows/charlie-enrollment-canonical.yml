name: Charlie enrollment canonicalization

on:
  push:
    branches:
      - forgedis-public-redesign
    paths:
      - scripts/patch_enrollment_canonical.py
      - .github/workflows/charlie-enrollment-canonical.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgedis-public-redesign
          fetch-depth: 0
      - name: Patch enrollment and add regressions
        run: python scripts/patch_enrollment_canonical.py
      - name: Remove one-shot machinery
        run: |
          rm -f scripts/patch_enrollment_canonical.py
          rm -f .github/workflows/charlie-enrollment-canonical.yml
      - name: Commit
        run: |
          git config user.name "Charlie CI"
          git config user.email "actions@users.noreply.github.com"
          git add server.py tests/test_charlie22.py scripts/patch_enrollment_canonical.py .github/workflows/charlie-enrollment-canonical.yml
          git diff --cached --check
          git commit -m "fix(P0): make Facility enrollment entitlement-authoritative"
          git push origin HEAD:forgedis-public-redesign
