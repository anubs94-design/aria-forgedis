<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — FORGEDIS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070B18;color:#F0F3FB;font-family:"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#11172A;border:1px solid #232B45;border-radius:16px;padding:40px 32px;width:100%;max-width:400px}
.logo{color:#FF7A59;font-weight:900;font-size:20px;letter-spacing:.12em;margin-bottom:6px}
h1{font-size:16px;font-weight:600;margin-bottom:6px}
.sub{font-size:13px;color:#A6B0CC;margin-bottom:28px}
label{font-size:12px;color:#A6B0CC;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px}
input{width:100%;padding:12px 14px;border-radius:8px;background:#070B18;border:1px solid #232B45;color:#F0F3FB;font-size:14px;margin-bottom:16px;outline:none;transition:border-color .2s}
input:focus{border-color:#FF7A59}
.btn{width:100%;padding:13px;border-radius:8px;border:none;background:#FF7A59;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.msg{margin-top:16px;padding:12px 14px;border-radius:8px;font-size:13px;display:none;line-height:1.5}
.msg.ok{background:rgba(52,211,153,.12);border:1px solid #34D399;color:#34D399}
.msg.err{background:rgba(229,72,77,.12);border:1px solid #E5484D;color:#E5484D}
</style>
</head>
<body>
<div class="card">
  <div class="logo">FORGEDIS</div>
  <h1>Nouveau mot de passe</h1>
  <p class="sub">Choisissez un nouveau mot de passe pour votre compte Aria.</p>
  <label>Nouveau mot de passe</label>
  <input type="password" id="mdp1" placeholder="••••••••" minlength="8">
  <label>Confirmer</label>
  <input type="password" id="mdp2" placeholder="••••••••" minlength="8">
  <button class="btn" id="btn" onclick="changerMdp()">Enregistrer</button>
  <div class="msg" id="msg"></div>
</div>
<script>
const sb = supabase.createClient(
  "https://dvlrilklbspuckbplglz.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2bHJpbGtsYnNwdWNrYnBsZ2x6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTk4NjE3MDQsImV4cCI6MjAzNTQzNzcwNH0.qS_VLHo3PCFXMX-KlNlS0gqlONYHTlR_w4LXg72ZPOY"
);

function msg(t,c){const e=document.getElementById("msg");e.textContent=t;e.className="msg "+c;e.style.display="block"}

// Extraire et injecter le token depuis le hash manuellement
window.addEventListener("load", async () => {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const access_token = params.get("access_token");
  const refresh_token = params.get("refresh_token");
  if(access_token) {
    await sb.auth.setSession({ access_token, refresh_token: refresh_token || "" });
  }
});

async function changerMdp(){
  const mdp1 = document.getElementById("mdp1").value;
  const mdp2 = document.getElementById("mdp2").value;
  if(mdp1.length < 8){msg("Minimum 8 caractères.","err");return}
  if(mdp1 !== mdp2){msg("Les mots de passe ne correspondent pas.","err");return}
  const btn = document.getElementById("btn");
  btn.disabled = true;
  btn.textContent = "Enregistrement...";
  const { error } = await sb.auth.updateUser({ password: mdp1 });
  if(error){
    btn.disabled = false;
    btn.textContent = "Enregistrer";
    msg("Erreur : " + error.message, "err");
    return;
  }
  document.querySelector(".card").innerHTML = "<div class='logo'>FORGEDIS</div><br><p style='color:#34D399;font-size:15px'>✅ Mot de passe modifié !<br><br>Retournez sur l'application et connectez-vous avec votre nouveau mot de passe.</p>";
}
</script>
</body>
</html>
